<style>
:root{--bg:#000;--fg:#fff;--mute:#9a9a9a;--line:#2b2b2b;--soft:#141414;
--head:"Reem Kufi","Tajawal",sans-serif;--body:"Tajawal",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.7}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
header img{height:44px;width:44px;object-fit:cover;object-position:center 40%}
header a.nav{font-family:var(--head);font-size:16px;text-decoration:none;border:1px solid var(--fg);padding:6px 18px;border-radius:999px}
header a.nav:hover{background:var(--fg);color:var(--bg)}
.hero{text-align:center;padding:48px 0 64px}
.hero img{width:min(78vw,360px);height:auto;display:block;margin:0 auto}
.hero h1{font-family:var(--head);font-weight:700;font-size:clamp(28px,7vw,42px);line-height:1.35;margin:8px auto 28px;max-width:16em}
.btn{font-family:var(--head);font-size:18px;font-weight:700;background:var(--fg);color:var(--bg);border:1px solid var(--fg);padding:12px 36px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--bg);color:var(--fg)}
section{padding:56px 0;border-top:1px solid var(--line)}
h2{font-family:var(--head);font-size:30px;font-weight:700;margin-bottom:6px}
.sub{color:var(--mute);margin-bottom:28px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.item h3{font-family:var(--head);font-size:21px;font-weight:500}
.item p{color:var(--mute);font-size:15px;grid-column:1}
.price{font-weight:700;white-space:nowrap}
.add{grid-column:2;grid-row:1/3;font-family:var(--body);font-weight:700;font-size:15px;color:var(--fg);background:none;border:1px solid var(--fg);border-radius:999px;padding:8px 18px;cursor:pointer}
.add:hover{background:var(--fg);color:var(--bg)}
.add span{display:block;font-size:12px;font-weight:400;color:inherit}
.price{grid-column:1}
.empty{color:var(--mute);padding:16px 0}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--fg);background:none;color:var(--fg);font-size:18px;cursor:pointer;line-height:1}
.qty button:hover{background:var(--fg);color:var(--bg)}
.total{display:flex;justify-content:space-between;font-family:var(--head);font-size:20px;padding:16px 0 28px}
label{display:block;margin-bottom:18px;font-weight:500}
input,textarea{width:100%;margin-top:6px;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit}
input:focus,textarea:focus{border-color:var(--fg);outline:none}
textarea{min-height:84px;resize:vertical}
.msg{margin-top:16px;min-height:1.7em}
.msg.err{color:#ff8a8a}
footer{border-top:1px solid var(--line);text-align:center;color:var(--mute);padding:32px 0;font-size:14px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

  <h1>اختر عطرك، واطلبه من مكانك</h1>
  <a class="btn" href="#products">شاهد العطور</a>
</div>

<section id="products"><div class="wrap">
  <h2>العطور</h2>
  <p class="sub">اضغط «أضف للطلب» على أي عطر، ثم أكمل بياناتك بالأسفل.</p>
  <div id="list"></div>
</div></section>

<section id="order"><div class="wrap">
  <h2>طلبك</h2>
  <p class="sub">بعد الإرسال، يفتح واتساب برسالة جاهزة بتفاصيل طلبك.</p>
  <div id="cart"></div>
  <form id="form" novalidate>
    <label>الاسم
      <input id="name" autocomplete="name" required>
    </label>
    <label>رقم الهاتف
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" required>
    </label>
    <label>المدينة والعنوان
      <input id="addr" autocomplete="street-address" required>
    </label>
    <label>ملاحظات (اختياري)
      <textarea id="note"></textarea>
    </label>
    <button class="btn" type="submit">أرسل الطلب عبر واتساب</button>
    <p class="msg" id="msg" role="status"></p>
  </form>
</div></section>
</main>

<footer>© ESAM PERFUME</footer>

<script>
/* ===== عدّل هنا ===== */
const WHATSAPP = "249000000000";   // رقم واتساب بصيغة دولية بدون + وبدون صفر (مثال السودان: 2499XXXXXXXX)
const CURRENCY = "ج.س";             // العملة
const PRODUCTS = [                  // أمثلة: بدّلها بعطورك وأسعارك
  {id:1, name:"عود ملكي",   note:"عطر عود، 50 مل",   price:15000},
  {id:2, name:"مسك أبيض",   note:"عطر مسك، 50 مل",   price:12000},
  {id:3, name:"رجالي كلاسيك", note:"عطر رجالي، 50 مل", price:14000},
  {id:4, name:"نسائي زهري",  note:"عطر نسائي، 50 مل", price:14000}
];
/* ==================== */

const order = {};
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("en-US") + " " + CURRENCY;

function renderList(){
  $("list").innerHTML = PRODUCTS.map(p => `
    <div class="item">
      <h3>${p.name}</h3>
      <button class="add" type="button" data-add="${p.id}">أضف للطلب</button>
      <p>${p.note}</p>
      <div class="price">${fmt(p.price)}</div>
    </div>`).join("");
}

function renderCart(){
  const ids = Object.keys(order);
  if(!ids.length){ $("cart").innerHTML = '<p class="empty">لم تضف أي عطر بعد.</p>'; return; }
  let total = 0;
  const rows = ids.map(id => {
    const p = PRODUCTS.find(x => x.id == id), q = order[id];
    total += p.price * q;
    return `<div class="line">
      <span>${p.name}</span>
      <span class="qty">
        <button type="button" data-dec="${id}" aria-label="تقليل">−</button>
        <b>${q}</b>
        <button type="button" data-inc="${id}" aria-label="زيادة">+</button>
      </span>
      <span class="price">${fmt(p.price*q)}</span>
    </div>`;
  }).join("");
  $("cart").innerHTML = rows + `<div class="total"><span>الإجمالي</span><span>${fmt(total)}</span></div>`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if(!t) return;
  const {add, inc, dec} = t.dataset;
  if(add || inc){ const id = add || inc; order[id] = (order[id]||0) + 1; }
  if(dec){ order[dec]--; if(order[dec] <= 0) delete order[dec]; }
  if(add || inc || dec){ renderCart(); $("msg").textContent = ""; }
  if(add){ t.textContent = "تمت الإضافة"; setTimeout(() => t.textContent = "أضف للطلب", 900); }
});

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const msg = $("msg"); msg.className = "msg";
  const name = $("name").value.trim(), phone = $("phone").value.trim(), addr = $("addr").value.trim();
  if(!Object.keys(order).length){ msg.className = "msg err"; msg.textContent = "أضف عطرًا واحدًا على الأقل قبل الإرسال."; return; }
  if(!name || !phone || !addr){ msg.className = "msg err"; msg.textContent = "أكمل الاسم ورقم الهاتف والعنوان."; return; }
  let total = 0;
  const lines = Object.keys(order).map(id => {
    const p = PRODUCTS.find(x => x.id == id), q = order[id]; total += p.price*q;
    return `- ${p.name} × ${q} = ${fmt(p.price*q)}`;
  });
  const text = ["طلب جديد من ESAM PERFUME", "", ...lines, "", "الإجمالي: " + fmt(total), "",
    "الاسم: " + name, "الهاتف: " + phone, "العنوان: " + addr, $("note").value.trim() ? "ملاحظات: " + $("note").value.trim() : ""].join("\n");
  msg.textContent = "جارٍ فتح واتساب...";
  window.open("https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(text), "_blank");
});

renderList(); renderCart();
</script>
</body>
</html>
